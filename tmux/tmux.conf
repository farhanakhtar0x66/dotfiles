# Terminal & True Color
set -g default-terminal "tmux-256color"
set-option -sa terminal-features ',xterm-256color:RGB'
set -g mouse on
set -g history-limit 10000

# Base Indexing & Window Renaming
set -g base-index 1
set -g pane-base-index 1
set-option -g renumber-windows on
set-option -g automatic-rename on
set-option -g automatic-rename-format "#{?pane_in_mode,[tmux],#{pane_current_command}}"

# Prefix (Ctrl+a)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Splits & Window Creation 
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Navigation
bind h previous-window
bind l next-window
bind Space last-window

# Vi Copy Mode
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection-and-cancel

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'

# Theme (GitHub Dark - Minimal Pills)
set -g status "on"
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#0d1117,fg=#c9d1d9"

# Pane Borders
set -g pane-border-style "fg=#30363d"
set -g pane-active-border-style "fg=#58a6ff"

# Messages & Selection
set -g message-style "bg=#161b22,fg=#58a6ff,bold"
set -g mode-style "bg=#1f6feb,fg=#ffffff"

# Left Status (Session Pill)
set -g status-left-length 100
set -g status-left "#{?client_prefix,#[fg=#bc8cff bg=#0d1117]#[fg=#0d1117 bg=#bc8cff bold] #S#[fg=#bc8cff bg=#0d1117] ,#[fg=#58a6ff bg=#0d1117]#[fg=#0d1117 bg=#58a6ff bold] #S#[fg=#58a6ff bg=#0d1117] }"

# Window Status (Pill Format)
set -g window-status-separator " "

# Inactive Window Pill
set -g window-status-format "#[fg=#21262d,bg=#0d1117]#[fg=#8b949e,bg=#21262d]#I #W#[fg=#21262d,bg=#0d1117]"

# Active Window Pill
set -g window-status-current-format "#[fg=#58a6ff,bg=#0d1117]#[fg=#0d1117,bg=#58a6ff,bold]#I #W#[fg=#58a6ff,bg=#0d1117]"

# Right Status (Directory & Time Pills)
set -g status-right-length 100
set -g status-right "#[fg=#21262d,bg=#0d1117]#[fg=#79c0ff,bg=#21262d] #[fg=#c9d1d9,bg=#21262d]#{b:pane_current_path}#[fg=#21262d,bg=#0d1117] #[fg=#21262d,bg=#0d1117]#[fg=#56d364,bg=#21262d] #[fg=#c9d1d9,bg=#21262d]%H:%M#[fg=#21262d,bg=#0d1117]"

# TPM Initialization 
run '~/.config/tmux/plugins/tpm/tpm'
