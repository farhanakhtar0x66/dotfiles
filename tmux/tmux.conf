# ── Terminal ──────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB,xterm-256color:RGB"
set -sg escape-time 0          # no lag after <Esc> in nvim
set -g focus-events on
set -g mouse on
set -g history-limit 50000
set -g set-clipboard on
set -g status-interval 5

# ── Indexing & naming ─────────────────────────────────────
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g automatic-rename on
setw -g automatic-rename-format "#{?pane_in_mode,[tmux],#{pane_current_command}}"

# ── Prefix (Ctrl+a) ───────────────────────────────────────
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ── Splits, windows, reload ───────────────────────────────
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind h previous-window
bind l next-window
bind Space last-window
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

# ── Vi copy mode ──────────────────────────────────────────
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# ── Theme: Zacess High Contrast (native, no plugin) ───────
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=default,fg=#ffffff"   # transparent: terminal blur shows through
set -g status-left ""
set -g status-right-length 80
set -g status-right "#[fg=#b3b3b3]#{b:pane_current_path} #[fg=#000000,bg=#8fd0ff,bold] #S "
setw -g window-status-separator " "
setw -g window-status-format         "#[fg=#b3b3b3,bg=#1a1a1a] #I #[fg=#e0e0e0,bg=#0f0f0f] #W "
setw -g window-status-current-format "#[fg=#000000,bg=#f5c400,bold] #I #[fg=#ffffff,bg=#1f1f1f,bold] #W#{?window_zoomed_flag, 󰊓,} "
setw -g window-status-activity-style "fg=#f2a6ff"
set -g pane-border-style        "fg=#2e2e2e"
set -g pane-active-border-style "fg=#f5c400"
set -g message-style            "bg=#f5c400,fg=#000000,bold"
set -g message-command-style    "bg=default,fg=#f5c400"
setw -g mode-style              "bg=#0a2552,fg=#ffffff"
set -g display-panes-active-colour "#f5c400"
set -g display-panes-colour "#b3b3b3"
setw -g clock-mode-colour "#f5c400"

# ── Plugins ───────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'

if-shell "test -x ~/.config/tmux/plugins/tpm/tpm" "run '~/.config/tmux/plugins/tpm/tpm'"
