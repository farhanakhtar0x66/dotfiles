"$schema" = 'https://starship.rs/config-schema.json'
# Minimal, high-contrast, single line. Only shows what is relevant to the cwd.
add_newline = false
command_timeout = 300
scan_timeout = 10
palette = "zacess"

format = """
$directory\
$git_branch\
$git_state\
$git_status\
$python\
$nodejs\
$bun\
$rust\
$golang\
$c\
$java\
$cmd_duration\
$jobs\
$character"""

[directory]
style = "bold blue"
read_only = " 󰌾"
read_only_style = "red"
truncation_length = 3
truncation_symbol = "…/"
format = "[$path]($style)[$read_only]($read_only_style) "

[git_branch]
symbol = " "
style = "bold magenta"
format = "[$symbol$branch]($style) "

[git_state]
style = "bold yellow"
format = '[\($state( $progress_current/$progress_total)\)]($style) '

[git_status]
style = "yellow"
format = '([$all_status$ahead_behind]($style) )'
ignore_submodules = true

[python]
symbol = " "
style = "yellow"
format = '[$symbol$version( \($virtualenv\))]($style) '

[nodejs]
symbol = " "
style = "green"
format = "[$symbol$version]($style) "

[bun]
symbol = " "
style = "bright-white"
format = "[$symbol$version]($style) "

[rust]
symbol = " "
style = "red"
format = "[$symbol$version]($style) "

[golang]
symbol = " "
style = "cyan"
format = "[$symbol$version]($style) "

[c]
symbol = " "
style = "blue"
format = "[$symbol$version]($style) "

[java]
symbol = " "
style = "red"
format = "[$symbol$version]($style) "

[cmd_duration]
min_time = 2000
style = "muted"
format = "[ $duration]($style) "
show_notifications = true
min_time_to_notify = 45000

[jobs]
symbol = "✦"
style = "cyan"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold yellow)"

[palettes.zacess]
# Zacess High Contrast Dark
black = "#000000"
muted = "#8a8a8a"
white = "#ffffff"
red = "#ff9e94"
green = "#26f444"
yellow = "#f5c400"
blue = "#8fd0ff"
magenta = "#f2a6ff"
cyan = "#00f4e0"
bright-white = "#ffffff"
